# Weekly: re-fetch the official lists. If anything changed, open a pull request so a
# person reviews the diff before it ships. A parser failure fails the job loudly.
name: Refresh data

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run data:fetch
      - run: npm test

      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/; then
            echo "No changes."
            exit 0
          fi
          branch="data/refresh-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/
          git commit -m "data: refresh official lists ($(date -u +%Y-%m-%d))"
          git push --force origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Data refresh $(date -u +%Y-%m-%d)" \
            --body "Automated refresh of the DOL List of Goods and the UFLPA Entity List. Review the diff in \`data/\` before merging." \
            || echo "A PR for this branch already exists."
